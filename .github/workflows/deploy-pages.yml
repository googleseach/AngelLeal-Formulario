# Despliega index.html y la carpeta assets/ a GitHub Pages.
#
# Se ejecuta en cada push a `main` que modifique index.html, assets/
# o este workflow.
#
# La URL pública es:
#   https://googleseach.github.io/AngelLeal-Formulario/

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:  # permite dispararlo manualmente desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p _site
          # Copia el HTML de entrada
          cp index.html _site/index.html
          # Copia toda la carpeta assets/ si existe
          if [ -d "assets" ]; then
            cp -r assets _site/assets
          fi
          # Archivo para evitar indexación en buscadores
          printf "User-agent: *\nDisallow: /\n" > _site/robots.txt

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4